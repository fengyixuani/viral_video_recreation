<text x="255" y="466" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="400" fill="#C7D5E7" text-anchor="start" dominant-baseline="middle" letter-spacing="0">固定九步主链承载状态；模型提供事实，规则决定动作，工具负责执行</text>
