<text x="70" y="192" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="700" fill="#F28C28" text-anchor="start" dominant-baseline="middle" letter-spacing="0">01 / FACT LAYER</text>
