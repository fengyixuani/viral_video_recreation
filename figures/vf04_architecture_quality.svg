<text x="100" y="110" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="18" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">一个稳定控制面，向上接收事实、向右调用能力、向下沉淀可复用的设计基线</text>
