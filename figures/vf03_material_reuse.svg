<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
<style>@font-face {font-family: ViralForgeCJK;src: url('file:///usr/share/fonts/google-droid/DroidSansFallback.ttf');font-style: normal;font-weight: 100 900;}</style>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324D" flood-opacity="0.10"/></filter>
<marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#1F5AA6"/></marker>
<marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#F28C28"/></marker>
</defs>
<rect width="1920" height="1080" fill="#FFFFFF"/>
<rect x="70" y="42" width="5" height="82" rx="0" fill="#F28C28" fill-opacity="1.0" stroke="#F28C28" stroke-width="1.4"/>
<text x="100" y="68" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="36" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">用户素材如何被匹配、复用和补齐</text>
<text x="100" y="110" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="18" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">先把长视频切成可检索片段，再逐镜判断：直接用、参考编辑，还是由 AI 补片</text>
<line x1="70" y1="150" x2="1850" y2="150" stroke="#DDE3EB" stroke-width="1" stroke-linecap="round"/>
<line x1="1385" y1="68" x2="1435" y2="68" stroke="#F28C28" stroke-width="3" stroke-linecap="round"/>
<text x="1850" y="68" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="600" fill="#0B2A5B" text-anchor="end" dominant-baseline="middle" letter-spacing="0.4">素材利用率是主指标</text>
<rect x="245" y="180" width="1605" height="205" rx="14" fill="#F7F9FC" fill-opacity="1.0" stroke="#E6ECF3" stroke-width="1"/>
<text x="72" y="208" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="700" fill="#F28C28" text-anchor="start" dominant-baseline="middle" letter-spacing="0">01</text>
<line x1="72" y1="230" x2="210" y2="230" stroke="#D7E1ED" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="262" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="22" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">素材建库</text>
<text x="72" y="296" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">按内容完整性切片</text>
<text x="72" y="317" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">建立语义索引</text>
<rect x="245" y="410" width="1605" height="275" rx="14" fill="#F7F9FC" fill-opacity="1.0" stroke="#E6ECF3" stroke-width="1"/>
<text x="72" y="438" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="700" fill="#F28C28" text-anchor="start" dominant-baseline="middle" letter-spacing="0">02</text>
<line x1="72" y1="460" x2="210" y2="460" stroke="#D7E1ED" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="492" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="22" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">逐镜决策</text>
<text x="72" y="526" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">画面和口播</text>
<text x="72" y="547" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">分开判断</text>
<rect x="245" y="710" width="1605" height="220" rx="14" fill="#F7F9FC" fill-opacity="1.0" stroke="#E6ECF3" stroke-width="1"/>
<text x="72" y="738" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="700" fill="#F28C28" text-anchor="start" dominant-baseline="middle" letter-spacing="0">03</text>
<line x1="72" y1="760" x2="210" y2="760" stroke="#D7E1ED" stroke-width="1" stroke-linecap="round"/>
<text x="72" y="792" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="22" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">窗口复用</text>
<text x="72" y="826" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">同片段多次使用</text>
<text x="72" y="847" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">但不重复画面</text>
<rect x="270" y="215" width="300" height="135" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1"/>
<rect x="294" y="233" width="44" height="3" rx="0" fill="#1F5AA6" fill-opacity="1.0" stroke="#1F5AA6" stroke-width="1.4"/>
<text x="294" y="258" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#1F5AA6" text-anchor="start" dominant-baseline="middle" letter-spacing="0">1</text>
<text x="328" y="258" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">用户原始视频</text>
<text x="294" y="293" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="16" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">一整卷连续画面</text>
<text x="294" y="318" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="16" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">可能包含多个动作与场景</text>
<rect x="660" y="215" width="300" height="135" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1"/>
<rect x="684" y="233" width="44" height="3" rx="0" fill="#1F5AA6" fill-opacity="1.0" stroke="#1F5AA6" stroke-width="1.4"/>
<text x="684" y="258" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#1F5AA6" text-anchor="start" dominant-baseline="middle" letter-spacing="0">2</text>
<text x="718" y="258" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">按语义切片</text>
<text x="684" y="293" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="16" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">一个片段表达一个动作</text>
<text x="684" y="318" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="16" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">时间轴首尾连续覆盖</text>
<rect x="1050" y="205" width="750" height="155" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1.4"/>
<text x="1080" y="236" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">可检索素材库</text>
<text x="1080" y="268" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">每段都有时间码、画面标签、人物/声音事实和召回文本</text>
<rect x="1080" y="307" width="135" height="34" rx="6" fill="#EAF1FB" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="1147.5" y="325" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="600" fill="#0B2A5B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">M01 商品特写</text>
<rect x="1215" y="307" width="170" height="34" rx="6" fill="#DCE9F8" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="1300.0" y="325" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="600" fill="#0B2A5B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">M02 真人使用</text>
<rect x="1385" y="307" width="125" height="34" rx="6" fill="#FFF1E3" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="1447.5" y="325" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="600" fill="#D86F0B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">M03 环境空镜</text>
<rect x="1510" y="307" width="180" height="34" rx="6" fill="#E3EDF9" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="1600.0" y="325" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="600" fill="#0B2A5B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">M04 口播演示</text>
<line x1="585" y1="282" x2="645" y2="282" stroke="#1F5AA6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="975" y1="282" x2="1035" y2="282" stroke="#1F5AA6" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<rect x="270" y="462" width="315" height="175" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1"/>
<rect x="294" y="480" width="44" height="3" rx="0" fill="#1F5AA6" fill-opacity="1.0" stroke="#1F5AA6" stroke-width="1.4"/>
<text x="294" y="505" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#1F5AA6" text-anchor="start" dominant-baseline="middle" letter-spacing="0">3</text>
<text x="328" y="505" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">待填的新分镜</text>
<text x="294" y="540" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">画面匹配：决定是否采用</text>
<text x="294" y="565" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">口播匹配：只决定音轨</text>
<text x="294" y="590" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">时长、主体、动作一起评分</text>
