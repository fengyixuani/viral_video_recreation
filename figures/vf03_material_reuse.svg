<text x="700" y="527" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="21" font-weight="700" fill="#D86F0B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">匹配度</text>
<text x="700" y="558" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="18" font-weight="600" fill="#D86F0B" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">0 ～ 1</text>
<text x="700" y="584" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="400" fill="#60758C" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">规则表决策</text>
<line x1="600" y1="548" x2="618" y2="548" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="820" y="438" width="980" height="215" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1.4"/>
<text x="850" y="466" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">三种执行路线</text>
<rect x="850" y="492" width="280" height="135" rx="6" fill="#EAF1FB" fill-opacity="1.0" stroke="#1F5AA6" stroke-width="1.2"/>
<rect x="868" y="507" width="42" height="3" rx="0" fill="#1F5AA6" fill-opacity="1.0" stroke="#1F5AA6" stroke-width="1.4"/>
<text x="868" y="528" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#1F5AA6" text-anchor="start" dominant-baseline="middle" letter-spacing="0">≥ 0.80</text>
<text x="868" y="561" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">直接裁剪</text>
<text x="868" y="588" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">真素材直接出镜</text>
<text x="868" y="609" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">按分镜时长裁取</text>
<rect x="1165" y="492" width="280" height="135" rx="6" fill="#FFF1E3" fill-opacity="1.0" stroke="#F28C28" stroke-width="1.2"/>
<rect x="1183" y="507" width="42" height="3" rx="0" fill="#F28C28" fill-opacity="1.0" stroke="#F28C28" stroke-width="1.4"/>
<text x="1183" y="528" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#F28C28" text-anchor="start" dominant-baseline="middle" letter-spacing="0">0.55 ≤ 分数 &lt; 0.80</text>
<text x="1183" y="561" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">素材编辑</text>
<text x="1183" y="588" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">画面可用但需改造</text>
<text x="1183" y="609" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">作为参考视频生成</text>
<rect x="1480" y="492" width="280" height="135" rx="6" fill="#F1F4F8" fill-opacity="1.0" stroke="#60758C" stroke-width="1.2"/>
<rect x="1498" y="507" width="42" height="3" rx="0" fill="#60758C" fill-opacity="1.0" stroke="#60758C" stroke-width="1.4"/>
<text x="1498" y="528" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">&lt; 0.55</text>
<text x="1498" y="561" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">AI 重新生成</text>
<text x="1498" y="588" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">素材库无法表达此镜</text>
<text x="1498" y="609" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">用设定图与商品图补齐</text>
<line x1="777" y1="548" x2="805" y2="548" stroke="#F28C28" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<rect x="270" y="750" width="1120" height="145" rx="6" fill="#FFFFFF" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1.4"/>
<text x="300" y="780" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="21" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">同一素材片段的取用窗口</text>
<rect x="300" y="824" width="250" height="46" rx="7" fill="#1F5AA6" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="425.0" y="848" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">镜头 1 · 第一刀</text>
<rect x="550" y="824" width="300" height="46" rx="7" fill="#3778C2" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="700.0" y="848" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">镜头 3 · 第二刀</text>
<rect x="850" y="824" width="205" height="46" rx="7" fill="#F28C28" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="952.5" y="848" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">镜头 6 · 第三刀</text>
<rect x="1055" y="824" width="300" height="46" rx="7" fill="#DCE3EB" fill-opacity="1.0" stroke="#FFFFFF" stroke-width="2"/>
<text x="1205.0" y="848" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="14" font-weight="600" fill="#60758C" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">尚未使用</text>
<line x1="300" y1="881" x2="1355" y2="881" stroke="#D7E1ED" stroke-width="2" stroke-linecap="round"/>
<text x="300" y="901" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">0s</text>
<text x="1355" y="901" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="12" font-weight="400" fill="#60758C" text-anchor="end" dominant-baseline="middle" letter-spacing="0">片段末尾</text>
<rect x="1450" y="750" width="350" height="145" rx="6" fill="#FFF1E3" fill-opacity="1.0" stroke="#D7E1ED" stroke-width="1"/>
<rect x="1474" y="768" width="44" height="3" rx="0" fill="#F28C28" fill-opacity="1.0" stroke="#F28C28" stroke-width="1.4"/>
<text x="1474" y="793" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="700" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">窗口规则</text>
<text x="1474" y="828" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">从上次结束处继续取</text>
<text x="1474" y="851" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">优先未使用的新鲜画面</text>
<text x="1474" y="874" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="15" font-weight="400" fill="#60758C" text-anchor="start" dominant-baseline="middle" letter-spacing="0">不足才回卷，并显式留痕</text>
<line x1="70" y1="962" x2="1850" y2="962" stroke="#D7E1ED" stroke-width="1" stroke-linecap="round"/>
<rect x="70" y="988" width="5" height="34" rx="0" fill="#F28C28" fill-opacity="1.0" stroke="#F28C28" stroke-width="1.4"/>
<text x="96" y="1005" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="13" font-weight="700" fill="#D86F0B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">核心结论</text>
<text x="220" y="1005" font-family="ViralForgeCJK, 'Droid Sans Fallback', sans-serif" font-size="20" font-weight="600" fill="#0B2A5B" text-anchor="start" dominant-baseline="middle" letter-spacing="0">画面过关就用画面，声音问题交给声音解决；素材确实覆盖不了时才由 AI 补片。</text>
</svg>