<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ViralForge · 爆款复刻</title>
<style>
:root{
  --bg:#07080d; --panel:rgba(20,22,34,.66); --panel-solid:#161825;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
  --text:#eceef6; --muted:#7d859c; --dim:#565e75;
  --accent:#7b8cff; --accent-2:#c072ff; --accent-soft:rgba(123,140,255,.13);
  --ok:#2ee6a8; --warn:#ffb84d; --err:#ff6b6b;
  --radius:18px; --shadow:0 1px 0 rgba(255,255,255,.035) inset, 0 20px 56px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",
  "Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;
  -webkit-user-select:text;user-select:text}
a{color:var(--accent);text-decoration:none}
::selection{background:rgba(123,140,255,.32)}

/* ---- 动态背景：三团缓慢漂移的极光 + 一层网格，纯 CSS，不依赖任何外部资源 ---- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -20%,#141a33 0%,#07080d 60%)}
.bg i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.5;
  mix-blend-mode:screen;will-change:transform}
.bg i:nth-child(1){width:52vw;height:52vw;left:-8vw;top:-14vw;
  background:radial-gradient(circle,#4a5cff 0%,transparent 66%);animation:drift1 34s ease-in-out infinite}
.bg i:nth-child(2){width:46vw;height:46vw;right:-10vw;top:4vw;
  background:radial-gradient(circle,#a94dff 0%,transparent 66%);animation:drift2 42s ease-in-out infinite}
.bg i:nth-child(3){width:44vw;height:44vw;left:26vw;bottom:-20vw;
  background:radial-gradient(circle,#00d4c8 0%,transparent 66%);animation:drift3 38s ease-in-out infinite}
.bg b{position:absolute;inset:0;display:block;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(120% 70% at 50% 0%,#000 20%,transparent 78%)}
@keyframes drift1{50%{transform:translate3d(12vw,8vh,0) scale(1.18)}}
@keyframes drift2{50%{transform:translate3d(-14vw,12vh,0) scale(.86)}}
@keyframes drift3{50%{transform:translate3d(9vw,-11vh,0) scale(1.12)}}
/* 用户开了「减少动态效果」就停掉漂移，别硬塞动画 */
@media(prefers-reduced-motion:reduce){.bg i{animation:none}}

/* 动态背景视频：用自家跑出来的成片，内网拉不到外部素材，也不用额外塞资源进仓库。
   重度模糊 + 压暗 + 慢速缩放，读起来是「有东西在动的氛围」而不是干扰内容的画面。 */
.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(30px) saturate(1.35) brightness(.46);transform:scale(1.16);
  opacity:0;transition:opacity 1.8s ease;animation:breathe 26s ease-in-out infinite}
.bgv.on{opacity:.85}
@keyframes breathe{50%{transform:scale(1.26) translate3d(0,-2%,0)}}
@media(prefers-reduced-motion:reduce){.bgv{animation:none}}
/* 压一层暗角+顶部渐变，保证卡片上的字始终够对比度 */
.bg u{position:absolute;inset:0;display:block;background:
  radial-gradient(130% 90% at 50% 0%,transparent 20%,rgba(5,6,11,.72) 78%),
  linear-gradient(180deg,rgba(5,6,11,.62) 0%,rgba(5,6,11,.3) 34%,rgba(5,6,11,.78) 100%)}
#btnBg{padding:8px 11px;font-size:13px;line-height:1}
#btnBg.off{opacity:.45}
/* ---- 布局 ---- */
header{flex:0 0 auto;z-index:20;padding:0 18px;height:52px;display:flex;align-items:center;gap:10px;
  background:rgba(9,10,16,.6);backdrop-filter:blur(20px) saturate(1.4);
  border-bottom:1px solid var(--line)}
header .brand{margin:0;font-size:14.5px;font-weight:600;letter-spacing:.6px;
  background:linear-gradient(96deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.grow{flex:1}
main{flex:1;min-height:0;padding:12px 14px;display:grid;
  grid-template-columns:352px minmax(0,1fr);gap:12px;overflow:hidden}
/* 窄屏没法一屏塞两栏，这时才允许整页滚动，否则什么都看不清 */
@media(max-width:900px){body{height:auto;overflow:auto}
  main{grid-template-columns:1fr;overflow:visible}
  .card.fill{flex:none}.scroll{overflow:visible}}

/* 一屏收口：整页不滚，只有面板内部滚。卡片撑满各自的格子。 */
.rail,.work{min-height:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);backdrop-filter:blur(20px) saturate(1.2);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;margin:0;min-height:0;display:flex;flex-direction:column}
.card.fill{flex:1}
/* 面板内部才滚：负 margin + padding 让滚动条贴到卡片边缘，不切掉内容 */
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 -16px -14px;
  padding:2px 16px 14px}
.scroll::-webkit-scrollbar{width:7px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
.foot{display:flex;gap:8px;align-items:center;padding-top:11px;border-top:1px solid var(--line)}
.foot button{flex:1}
p.hint{margin:0 0 12px;color:var(--muted);font-size:12px}

/* ---- 表单控件：标签只留必要的，说明一律进 title 提示 ---- */
label.field,.field{display:block;margin-bottom:12px}
label.field>span,.field>span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;
  letter-spacing:.2px}
input[type=text],textarea,select{width:100%;padding:8px 11px;border:1px solid var(--line);
  border-radius:10px;background:rgba(255,255,255,.035);font:inherit;color:inherit;outline:none;
  transition:.16s;-webkit-user-select:text;user-select:text;pointer-events:auto}
input[type=text]::placeholder,textarea::placeholder{color:var(--dim)}
input[type=text]:focus,textarea:focus,select:focus{border-color:rgba(123,140,255,.55);
  background:rgba(255,255,255,.06);box-shadow:0 0 0 3px var(--accent-soft)}
select option{background:var(--panel-solid);color:var(--text)}
textarea{resize:vertical;min-height:64px}
button{font:inherit;border:1px solid var(--line-strong);background:rgba(255,255,255,.045);
  color:var(--text);padding:7px 13px;border-radius:10px;cursor:pointer;transition:.16s;
  -webkit-user-select:none;user-select:none}
button:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.24)}
button.primary{background:linear-gradient(96deg,var(--accent),var(--accent-2));border-color:transparent;
  color:#fff;font-weight:500;box-shadow:0 8px 22px rgba(123,140,255,.26)}
button.primary:hover{filter:brightness(1.1)}
button.danger{color:var(--err);border-color:rgba(255,107,107,.28)}
button.danger:hover{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.45)}
/* 幽灵按钮：工具栏里的次要动作，平时几乎看不见，hover 才浮出来 */
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 9px}
button.ghost:hover{background:rgba(255,255,255,.07);color:var(--text);border-color:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* ---- 上传区与素材缩略图 ---- */
.drop{border:1.5px dashed rgba(255,255,255,.18);border-radius:13px;padding:16px;text-align:center;
  color:var(--muted);cursor:pointer;transition:.16s;background:rgba(255,255,255,.025);font-size:12.5px}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:#c3cbff}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;margin-top:10px}
/* ---- 素材槽位：一行标题 + 缩略图，没有虚线框也没有说明文字 ---- */
.slot{padding:9px 0;border-top:1px solid var(--line);transition:.16s}
.slot:first-child{border-top:none;padding-top:0}
.slot.over{background:var(--accent-soft);box-shadow:0 0 0 8px var(--accent-soft)}
.slot-h{display:flex;align-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.slot-h span{flex:1;letter-spacing:.2px}
.slot-h button{padding:3px 7px;font-size:11.5px;line-height:1.3}
.slot .thumbs{margin-top:7px}
.slot .thumbs:empty{display:none}
/* 参考片和商品图是复刻的两个依据，给它们更大的画面，竖版视频也能看清主体 */
.slot .thumbs[data-list="reference_video"],
.slot .thumbs[data-list="product_images"]{
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.slot .thumbs[data-list="reference_video"] .thumb,
.slot .thumbs[data-list="product_images"] .thumb{aspect-ratio:3/4}
.thumb{position:relative;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:#0c0e17;aspect-ratio:1/1;cursor:zoom-in}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
/* 视频缩略图平时显示首帧图，hover 时才换成正在播放的 video */
.thumb video{display:none}
.thumb.playing video{display:block}
.thumb.playing img.poster{display:none}
.thumb .ph{display:flex;align-items:center;justify-content:center;height:100%;font-size:22px;
  color:var(--dim)}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;font-size:10.5px;
  background:linear-gradient(transparent,rgba(0,0,0,.86));color:#dfe3f2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.thumb .x{position:absolute;top:4px;right:4px;width:20px;height:20px;padding:0;line-height:18px;
  border-radius:50%;font-size:12px;background:rgba(0,0,0,.6);border-color:transparent;color:#fff}
.thumb .x:hover{background:var(--err)}
.thumb .tag{position:absolute;top:4px;left:4px;padding:1px 6px;border-radius:6px;font-size:10px;
  background:rgba(0,0,0,.6);color:#cfd6ee}
/* 「贴合」角标：让用户知道这条为什么排在前面，而不是感觉顺序被随机打乱 */
.fit{padding:1px 7px;border-radius:6px;font-size:10px;color:#fff;
  background:linear-gradient(96deg,var(--accent),var(--accent-2))}
.thumb .fit{position:absolute;top:4px;left:44px}
.lib-group-t .fit{font-size:10.5px}

/* ---- 开关与分段控件：说明文字全部收进 title，一行只留名字 ---- */
.opt{display:flex;align-items:center;gap:10px;padding:7px 0}
.opt .txt{flex:1;font-size:12.5px;color:#d3d8e8}
.switch{position:relative;width:34px;height:19px;flex:0 0 34px}
.switch input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:rgba(255,255,255,.12);border-radius:19px;
  transition:.2s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;
  border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.switch input:checked + i{background:linear-gradient(96deg,var(--accent),var(--accent-2))}
.switch input:checked + i::after{transform:translateX(15px)}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.04);padding:3px;border-radius:11px;
  border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:6px 9px;
  font-size:12px;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.09);color:var(--text);border:1px solid var(--line)}

/* ---- 步骤：只呈现用户需要关注的复刻阶段；入库校验不占进度轨 ---- */
/* 只读任务的说明条：平时不占位，选中跑过的任务时才出现 */
.mat-note{display:none;margin:0 0 11px;padding:7px 10px;border-radius:10px;font-size:11.5px;
  color:#c3cbff;background:var(--accent-soft);border:1px solid rgba(123,140,255,.22)}
.mat-note.on{display:block}
.steps{list-style:none;margin:11px 0 0;padding:0;display:flex;gap:0;align-items:flex-start}
.steps li{position:relative;flex:1;min-width:0;cursor:pointer;padding-right:8px}
.steps li:not(:last-child)::after{content:"";position:absolute;top:8px;left:18px;right:0;height:2px;
  background:rgba(255,255,255,.09);z-index:0}
.steps li>i{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:18px;
  height:18px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid #171927;transition:.2s}
.steps li>i::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--dim)}
.steps li>.nm{display:block;margin-top:6px;font-size:11px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* 耗时紧跟步骤名，小一号、暗一点，不再单独占一行 */
.steps li>.nm em{font-style:normal;margin-left:4px;font-size:10px;opacity:.75;
  font-variant-numeric:tabular-nums}
.steps li.done>i{background:var(--ok);border-color:rgba(46,230,168,.35)}
.steps li.done>i::after{width:6px;height:3px;border-radius:0;background:transparent;border-left:1.5px solid #07120e;
  border-bottom:1.5px solid #07120e;transform:rotate(-45deg) translate(1px,-1px)}
.steps li.done:not(:last-child)::after{background:rgba(46,230,168,.55)}
.steps li.done>.nm{color:var(--muted)}
.steps li.fail>i{background:var(--err);border-color:rgba(255,107,107,.35)}
.steps li.fail>i::after{background:#2e0f13}
.steps li.fail>.nm{color:var(--err)}
.steps li.run>i{width:22px;height:22px;margin:-2px 0 -2px -2px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:rgba(255,255,255,.45);box-shadow:0 0 0 5px var(--accent-soft);animation:pulse 1.3s infinite}
.steps li.run>i::after{background:#fff}
.steps li.run>.nm{color:var(--text)}
.steps li:hover>.nm{color:var(--text)}
/* 点开某一步：名字高亮，详情显示在下面那一行 */
.steps li.sel>.nm{color:var(--accent)}
.steps li.sel>i{box-shadow:0 0 0 4px var(--accent-soft)}
@keyframes pulse{50%{opacity:.4}}
/* 状态行：呼吸灯 + 步骤名 + 这步的结论，耗时和进度收到同一行右端 */
.stepnow{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:8px}
.stepnow b{color:var(--text);font-weight:500}
.stepnow .si{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepnow .tail{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.stepnow .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 6px}
.stepnow .dot.run{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  animation:pulse 1.2s infinite}
.stepnow .dot.done{background:var(--ok)}.stepnow .dot.fail{background:var(--err)}
.errline{color:var(--err);font-size:12px;margin-top:7px;word-break:break-all}
/* 日志归属：标出这是哪条任务的日志，避免误以为混进了上一条任务的记录 */
.log-head{margin:0 0 8px;font-size:11.5px;color:var(--dim);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
pre.log{margin:0;background:rgba(0,0,0,.38);color:#b9c4e8;border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;font-size:11.5px;line-height:1.7;overflow:auto;
  white-space:pre-wrap;word-break:break-all;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;
  background:var(--accent-soft);color:#b7c1ff;border:1px solid rgba(123,140,255,.28)}
.badge.ok{background:rgba(46,230,168,.13);color:var(--ok);border-color:rgba(46,230,168,.3)}
.badge.err{background:rgba(255,107,107,.13);color:var(--err);border-color:rgba(255,107,107,.3)}
.badge.idle{background:rgba(255,255,255,.06);color:var(--muted);border-color:var(--line)}
video{width:100%;border-radius:13px;background:#000;display:block}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12.5px;justify-content:center}
/* 成片下面只留一行：左边一句话摘要，右边下载按钮，细节放 title */
.result-bar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;
  color:var(--muted)}
.result-bar .rm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  cursor:help}
/* 下载成片：成片区最主要的动作，给它主色底，别混在灰色链接里 */
.btn-dl{border:none;padding:5px 14px;border-radius:9px;font-size:12px;
  background:linear-gradient(96deg,var(--accent),var(--accent-2));
  color:#fff;text-decoration:none;white-space:nowrap}
.btn-dl:hover{filter:brightness(1.08)}
.links a,.links button{border:1px solid var(--line);padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.04);color:#c8cfe8;font-size:12.5px;line-height:1.5}
.links a:hover,.links button:hover{border-color:var(--accent);background:var(--accent-soft);
  color:#fff}
.kv{font-size:12.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:500}
.toast{position:fixed;right:22px;bottom:22px;z-index:60;background:rgba(18,20,32,.94);
  backdrop-filter:blur(12px);border:1px solid var(--line-strong);color:#fff;padding:12px 17px;
  border-radius:12px;font-size:13px;box-shadow:0 16px 40px rgba(0,0,0,.5);opacity:0;
  transform:translateY(10px);transition:.2s;pointer-events:none;max-width:440px}
.toast.show{opacity:1;transform:none}
/* ---- 关键信息：标签页 + 无框卡片 + 时间线 ---- */
.tabs{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin-bottom:12px;
  border-bottom:1px solid var(--line)}
.tabs button{border:none;background:transparent;color:var(--dim);border-radius:0;padding:7px 11px;
  font-size:12.5px;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tabs button:hover{background:transparent;color:var(--muted)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane{display:none}.pane.on{display:block}
.empty{color:var(--dim);font-size:12.5px;padding:44px 0;text-align:center}
/* 事实/剧本字段：不画框，用极小的标签 + 内容对齐，靠留白分组而不是靠边框 */
.facts{display:grid;gap:15px}
.fact h4{margin:0 0 4px;font-size:10.5px;color:var(--dim);font-weight:500;letter-spacing:.8px;
  text-transform:uppercase}
/* 正文行高和字号都往上提一档：这些字段动辄两三行长句，太密就只能一个字一个字读 */
.fact>div{font-size:13px;line-height:1.72;white-space:pre-wrap;word-break:break-word;
  color:#d8dcea}
/* ---- 商品事实卡：真的做成一张卡。标题区 → 卖点 → 人群/场景/外观 → 商品图 → 来源脚注，
   分区之间用细分隔线断开，比一列小标签更好读 ---- */
.pcard{border:1px solid var(--line-strong);border-radius:16px;padding:17px 18px 16px;
  background:linear-gradient(180deg,rgba(123,140,255,.07),rgba(255,255,255,.015));
  box-shadow:var(--shadow)}
.pcard-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pcard-h h3{margin:0;font-size:17px;font-weight:600;letter-spacing:.3px}
.pcard-h em{font-style:normal;padding:2px 9px;border-radius:999px;font-size:11px;
  background:var(--accent-soft);color:#c3cbff;border:1px solid rgba(123,140,255,.24)}
/* 一句话文案是这张卡的主张，给它渐变竖条，和下面的字段区分开 */
.pcard-copy{margin:11px 0 0;padding-left:11px;font-size:13.5px;color:#e4e7f4;line-height:1.65;
  border-left:2px solid;border-image:linear-gradient(180deg,var(--accent),var(--accent-2)) 1}
.pcard-sec{margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.pcard-sec>h4{margin:0 0 9px;font-size:10.5px;color:var(--dim);font-weight:500;
  letter-spacing:.8px;text-transform:uppercase}
.plist{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.plist li{position:relative;padding-left:16px;font-size:13px;line-height:1.7;color:#d8dcea}
.plist li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;
  border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
/* 一行至少留出 ~30 个汉字的宽度再分栏：minmax 给小值会分出四五栏，每行只剩几个字，
   长句读起来全是折行。窄屏时 min(100%,…) 自动退回单栏。 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));
  gap:16px 26px}
.pcard .imgwall{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
/* @图片N 角标：生成端按这个顺序引用参考图，编号要能直接对上 */
.refno{position:absolute;left:5px;top:5px;padding:1px 6px;border-radius:6px;font-size:10px;
  color:#fff;background:rgba(8,9,15,.66);backdrop-filter:blur(4px)}
/* 「改造」角标：这张不是原图，是体检后重画过的那张 */
.refno.fix{left:auto;right:5px;background:linear-gradient(96deg,var(--accent),var(--accent-2))}
/* ---- 拆解卡：摘要胶囊 + 结构时间轴 + 情绪柱 + 镜头骨架 ---- */
.sumbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.sumbar span{padding:2px 9px;border-radius:999px;font-size:11.5px;color:#c4cbe0;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
/* 结构：名称和时间区间同一行当小标题，作用另起一行占满宽度——三列并排会把作用挤成
   每行几个字 */
.tlsteps{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.tlsteps li{font-size:13px;line-height:1.7;color:#d8dcea}
.tlsteps .hd{display:flex;align-items:baseline;gap:9px;margin-bottom:1px}
.tlsteps b{font-weight:500;color:#c3cbff}
.tlsteps .rg{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
/* 情绪曲线：强度当柱高，比一行「00:02 好奇 2」的键值对好认得多 */
.mood{display:flex;align-items:flex-end;gap:10px;height:84px}
.mood .mb{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;
  justify-content:flex-end;align-items:center;gap:4px}
.mood .mb i{width:100%;max-width:32px;min-height:3px;border-radius:5px 5px 2px 2px;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));opacity:.85}
.mood .mb em{font-style:normal;font-size:11px;color:#c8cfe8;white-space:nowrap}
.mood .mb u{text-decoration:none;font-size:10.5px;color:var(--dim);
  font-variant-numeric:tabular-nums}
.skel{display:grid;gap:9px}
.skel .row{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.7;
  color:#d8dcea}
.skel .row .k{flex:0 0 50px;text-align:center;padding:1px 0;border-radius:6px;font-size:10.5px;
  color:#a8b3ff;background:var(--accent-soft)}
.skel .row .d{flex:0 0 30px;color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums}
.skel .row em{font-style:normal;color:var(--muted);font-size:12px}
/* 分镜行：头行只放序号/时间/叙事功能，画面正文和细节各自成行 */
.shot-h{display:flex;align-items:baseline;gap:8px}
.shot-h .t{margin-left:0}
.shot-h .role{margin-left:auto;padding:1px 8px;border-radius:999px;font-size:10.5px;
  color:#c3cbff;background:var(--accent-soft);white-space:nowrap}
.shot .pic{margin-top:6px;font-size:13px;line-height:1.72;color:#e0e4f1}
.shot .kvline{margin-top:5px}
.pfoot{margin-top:14px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;
  color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:2px 8px;border-radius:7px;font-size:11.5px;background:rgba(255,255,255,.05);
  color:#c4cbe0}
.shots{display:grid;gap:1px;background:var(--line);border-radius:12px;overflow:hidden;
  margin-top:16px}
.shot{background:#12141f;padding:12px 15px;font-size:13px}
.shot .no{display:inline-block;min-width:19px;text-align:center;border-radius:5px;font-size:10.5px;
  margin-right:8px;color:#a8b3ff;background:var(--accent-soft)}
.shot .t{color:var(--dim);font-size:11px;margin-left:6px}
.shot p{margin:6px 0 0;color:var(--muted);font-size:12.5px;line-height:1.7}
.shot .say{margin-top:6px;padding-left:9px;border-left:1.5px solid rgba(123,140,255,.45);
  color:#c6ccdf;line-height:1.7}
.shot .chips{margin-top:6px;opacity:.7}
/* 片段时间线：横向滚动，按段号顺序排 */
.timeline{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px}
.timeline::-webkit-scrollbar{height:6px}
.timeline::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.tl-item{flex:0 0 148px;border-radius:12px;overflow:hidden;background:#12141f;cursor:pointer;
  transition:.16s}
.tl-item:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.tl-item.bad{outline:1px solid rgba(255,107,107,.4)}
.tl-item video{border-radius:0;aspect-ratio:9/16;object-fit:cover}
.tl-item .miss{aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;
  color:var(--err);font-size:11.5px;text-align:center;padding:10px;background:rgba(255,107,107,.06)}
.tl-item .meta{padding:7px 9px;font-size:11px;color:var(--dim)}
.tl-item .meta b{display:block;color:var(--text);font-size:12px;font-weight:500;margin-bottom:1px}

/* ---- 弹窗：素材库 / 预览 ---- */
.mask{position:fixed;inset:0;z-index:40;background:rgba(4,5,9,.72);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;padding:28px}
.mask.on{display:flex}
.modal{width:min(1040px,100%);max-height:86vh;display:flex;flex-direction:column;
  background:rgba(20,22,34,.96);border:1px solid var(--line-strong);border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.modal .top{display:flex;align-items:center;gap:12px;padding:16px 20px;
  border-bottom:1px solid var(--line)}
.modal .top h3{margin:0;font-size:14px}
.modal .body{display:grid;grid-template-columns:196px minmax(0,1fr);min-height:0;flex:1}
@media(max-width:760px){.modal .body{grid-template-columns:1fr}}
.cats{border-right:1px solid var(--line);overflow:auto;padding:10px}
.cats button{display:block;width:100%;text-align:left;border:none;background:transparent;
  padding:9px 11px;border-radius:10px;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.cats button.on,.cats button:hover{background:rgba(255,255,255,.07);color:var(--text)}
.cats button em{font-style:normal;float:right;color:var(--dim);font-size:11px}
.picker{overflow:auto;padding:14px 16px}
.picker .thumbs{margin-top:0;grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
.picker .thumb{cursor:pointer;aspect-ratio:3/4}
.picker .thumb:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* ---- 参考素材库：每个商品/主题独立成卡，避免多组素材糊成一片 ---- */
.lib-group{padding:13px 14px 14px;border:1px solid var(--line-strong);border-radius:16px;
  background:rgba(255,255,255,.03)}
.lib-group+.lib-group{margin-top:14px}
.lib-group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lib-group-t{display:flex;align-items:center;gap:8px;position:relative;padding-left:11px;
  font-size:13.5px;color:var(--text)}
/* 组名左侧的渐变竖条：扫一眼就知道从哪里开始是新的一组 */
.lib-group-t::before{content:"";position:absolute;left:0;top:1px;bottom:1px;width:3px;
  border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.lib-group-t em{font-style:normal;padding:1px 8px;border-radius:999px;font-size:11px;
  background:var(--accent-soft);color:#c3cbff}
.lib-group-d{flex:1;min-width:140px;margin:0;font-size:11.5px;color:var(--muted)}
.lib-group-h button{margin-left:auto}
/* .modal 自带 overflow:hidden，预览这层必须放开，否则贴边的关闭按钮会被裁掉 */
.lightbox{max-width:min(88vw,1100px);max-height:86vh;overflow:visible}
.lightbox img,.lightbox video{max-width:100%;max-height:78vh;width:auto;border-radius:14px;
  display:block;margin:0 auto;background:#000}
#pvBody{position:relative;display:flex;justify-content:center}
/* 关闭按钮压在画面右上角内侧：放到外侧会被上层容器裁成一小块 */
.pv-x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;line-height:30px;
  border-radius:50%;font-size:19px;background:rgba(12,14,23,.78);border:1px solid var(--line-strong);
  color:#fff;backdrop-filter:blur(6px);z-index:2}
.pv-x:hover{background:var(--err);border-color:transparent}
/* 浏览器把预览压成静音时才出现：点它就是一次干净的用户手势，声音一定能开 */
.pv-sound{display:none;position:absolute;left:50%;bottom:66px;transform:translateX(-50%);
  padding:8px 16px;border-radius:999px;font-size:12.5px;z-index:2;
  background:linear-gradient(96deg,var(--accent),var(--accent-2));border:none;color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}
.pv-sound.on{display:block}
/* 中间产物字段值：嵌套对象/对象数组降解成可读的行 */
.rows{display:grid;gap:5px}
.sub{border-left:2px solid rgba(123,140,255,.35);padding-left:9px}
.kvline{display:flex;gap:9px;align-items:baseline;font-size:13px;line-height:1.7}
.kvline>span:last-child{flex:1;min-width:0;color:#d5daea}
.sk{flex:0 0 62px;color:var(--dim);font-size:11.5px}
.imgwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}

/* 左栏更紧凑：一屏之内挤三块内容，间距和字号都要收 */
.rail .field{margin-bottom:11px}
.rail .field>span{margin-bottom:5px;font-size:12px}
.rail textarea{min-height:62px}
.rail .opt{padding:9px 0}
.rail .thumbs{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.rail p.hint{margin-bottom:11px;font-size:12px}

</style>
</head>
<body>
<div class="bg">
  <video class="bgv" id="bgv" muted loop playsinline preload="metadata"></video>
  <i></i><i></i><i></i><b></b><u></u>
</div>

<header>
  <h1 class="brand">ViralForge</h1>
  <div class="grow"></div>
  <select id="taskPick" style="width:250px"><option value="">新建任务</option></select>
  <button class="ghost" id="btnNew" title="新建任务">＋</button>
  <button class="ghost" id="btnBg" title="动态背景">✦</button>
</header>

<main>
  <aside class="rail">
    <div class="card fill">
      <div class="tabs" id="inTabs">
        <button data-p="mat" class="on">素材与商品</button>
        <button data-p="cfg">参数</button>
      </div>
      <div class="scroll">
        <div class="pane on" id="pane-mat">
          <p class="mat-note" id="matNote"></p>
          <div id="uploads"></div>
          <label class="field"><span>商品名</span><input type="text" id="pName" placeholder="例如：XIAOMI 17 Ultra" /></label>
          <label class="field"><span>卖点</span><textarea id="pPoints"
            placeholder="一行一条"></textarea></label>

            </div>
          </label>

      </div>

      </div>
    </div>
  </aside>
  <section class="work">
    <div class="card">
      <div class="row">
        <input type="text" id="taskTitle" style="flex:1;min-width:160px"
               placeholder="任务名称" title="改完回车生效；清空回到「时间戳 · 商品名」" />
        <span class="badge idle" id="status">未开始</span>
        <select id="resetStep" style="width:auto" title="选一步重跑"></select>
        <button class="ghost" id="btnReset" title="从所选步骤重跑">↻</button>
        <button class="ghost danger" id="btnDelete" title="删除任务">✕</button>
      </div>
      <ul class="steps" id="steps"></ul>

    <div class="card fill">
      <div class="tabs" id="ovTabs">
        <button data-p="final" class="on">成片</button>
        <button data-p="ref">拆解</button>
        <button data-p="product">事实卡</button>
        <button data-p="script">剧本</button>
        <button data-p="clips">片段</button>
        <button data-p="log">日志</button>
        <div class="grow"></div>
        <button class="ghost" id="btnOverview" title="刷新">↻</button>
      </div>
      <div class="scroll">
        <div class="pane on" id="pane-final">
          <div id="resultBox"></div>
        </div>
        <div class="pane" id="pane-ref"></div>
        <div class="pane" id="pane-product"></div>
        <div class="pane" id="pane-script"></div>
        <div class="pane" id="pane-clips"></div>
        <div class="pane" id="pane-log">

</main>
<div class="mask" id="libMask">
  <div class="modal">
    <div class="top">
      <h3 id="libTitle">素材库</h3>
      <span class="kv" id="libHint"></span>
      <div class="grow"></div>
      <button id="libClose">关闭</button>
    </div>

      <div class="cats" id="libCats"></div>
      <div class="picker" id="libFiles"></div>

</div>

<div class="mask" id="pvMask">
  <div class="modal lightbox" style="background:transparent;border:none;box-shadow:none">
    <div id="pvBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// label 只留最短的名字，要求和说明进 title——版面上不再堆解释性文字
const KINDS = [
  {key:"reference_video", label:"爆款参考视频 *", tip:"必填，单个 mp4/mov", multiple:false, media:"video"},
  {key:"product_images", label:"商品图", tip:"可多张，第一张作为主图；不传就从商品视频里抽帧补齐", multiple:true, media:"image"},
  {key:"user_videos", label:"商品视频", tip:"可多条，会被切片后优先复用；没有商品图时用它抽帧补齐", multiple:true, media:"video"},
];
const OPTS = [
  {key:"copy_bgm", label:"复刻 BGM", tip:"只有BGM则整轨复用；BGM+口播则分离伴奏；没有BGM则不使用"},
  {key:"copy_subtitles", label:"复刻字幕", tri:true,
   tip:"跟随参考片：参考片画面有字才烧；参考片没字就不叠字。关掉则一律不烧"},
  {key:"dub_all_cuts", label:"素材全部重配音",
   tip:"直接用的用户素材一律静音，改用克隆音色重新配音，整片只有一把嗓子；关掉则口播对得上又没BGM的切片保留原声"},
];
let meta = null, task = null, timer = null, productSaveTimer = null;
let taskLoadSeq = 0;
let mode = "creative", accessToken = "";
// libCat 有两种取值：品类筛选用字符串（""=推荐/全部），旧的历史素材分类页用下标
let lib = null, libKind = "", libCat = "", overview = null;
let stepPick = "";   // 用户点开了哪一步的信息；空=跟随当前步骤
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 耗时统一成 8.2s / 2m18s：811.9 这种秒数直接摆出来没人读得快
function fmtSec(s){
  const n = Number(s);
  if(!isFinite(n)) return "";
  if(n < 60) return (n < 10 ? n.toFixed(1) : String(Math.round(n))) + "s";
  return Math.floor(n / 60) + "m" + String(Math.round(n % 60)).padStart(2, "0") + "s";
}

function toast(msg, ms=2600){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), ms);
}
function token(){ return accessToken; }
async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers||{});
  if(token()) headers["Authorization"] = "Bearer " + token();
  if(opts.json){ headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
  const res = await fetch("/api" + path, Object.assign({}, opts, {headers}));
  const data = await res.json().catch(()=>({error:"返回不是 JSON"}));
  if(!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
const tokenQS = () => token() ? "&token=" + encodeURIComponent(token()) : "";
// 任务目录内的产物
function fileUrl(path){
  return "/api/tasks/" + task.task_id + "/file?path=" + encodeURIComponent(path) + tokenQS();
}
// 素材库/历史任务里的素材：不在当前任务目录下，走单独的预览接口
function libUrl(abs){
  return "/api/library/file?path=" + encodeURIComponent(abs) + tokenQS();
}
// 视频首帧图：列表里几十条视频，直接塞 <video> 会把整段都拉下来
function posterUrl(abs){
  return "/api/library/poster?path=" + encodeURIComponent(abs) + tokenQS();
}
// 视频缩略图：先只显示首帧图，鼠标移上去才把视频加载进来播（见 wireHoverPlay）
function videoThumbHtml(abs){
  return `<img class="poster" src="${posterUrl(abs)}" loading="lazy" alt="" />
    <video preload="none" data-src="${libUrl(abs)}" muted loop playsinline></video>`;
}
// 已登记的素材可能在任务目录内（上传的）也可能在外面（复用的），统一用 libUrl 取
const mediaOf = (name) => /\.(mp4|mov|mkv|webm|avi|m4v)$/i.test(name) ? "video"
  : /\.(jpe?g|png|webp|bmp)$/i.test(name) ? "image"
  : /\.(mp3|wav|m4a|aac|flac|ogg)$/i.test(name) ? "audio" : "";
/* ---------- 动态背景 ---------- */
function bgWanted(){ return localStorage.getItem("vf_bg") !== "off"; }
function applyBg(){
  const v = $("bgv"), on = bgWanted();
  $("btnBg").classList.toggle("off", !on);
  if(!on){ v.classList.remove("on"); v.pause(); return; }
  const src = meta && meta.bg_video && meta.bg_video.task_id
    ? `/api/tasks/${meta.bg_video.task_id}/file?path=` +
      encodeURIComponent(meta.bg_video.path) + tokenQS() : "";
  if(!src) return;                       // 还没跑出成片，就只留 CSS 极光
  if(v.dataset.src !== src){
    v.dataset.src = src; v.src = src;
    // 等能播了再淡入，否则先闪一帧黑
    v.oncanplay = () => v.classList.add("on");
  }else{ v.classList.add("on"); }
  v.play().catch(()=>{});               // 自动播放被拦就算了，静音的一般不会
}
$("btnBg").onclick = () => {
  localStorage.setItem("vf_bg", bgWanted() ? "off" : "on");
  applyBg();
  toast(bgWanted() ? "动态背景已开" : "动态背景已关");
};

/* ---------- 预览弹窗 ---------- */
function preview(url, name){
  const kind = mediaOf(name);
  // 不写 autoplay：属性自动播放和脚本播放会各走一条路，浏览器拦掉带声那条之后
  // 往往留下一个静音在放的播放器。统一由下面在点击的同步栈里 play()，才能带声音。
  $("pvBody").innerHTML = (kind === "video"
    ? `<video id="pvVideo" src="${url}" controls playsinline></video>`
    : kind === "audio" ? `<audio id="pvAudio" src="${url}" controls
        style="width:min(78vw,560px)"></audio>`
    : `<img src="${url}" alt="${esc(name)}" />`)
    + `<button type="button" class="pv-x" id="pvClose" title="关闭（Esc）">×</button>`
    + (kind === "video" || kind === "audio"
      ? `<button type="button" class="pv-sound" id="pvSound">点这里打开声音</button>` : "");
  $("pvClose").onclick = (e) => { e.stopPropagation(); closePreview(); };
  $("pvMask").classList.add("on");
  const player = $("pvVideo") || $("pvAudio");
  if(!player) return;
  const unmute = () => { player.muted = false; player.volume = 1; };
  // 浏览器可能在真正开始播的那一刻才把这次播放判成自动播放并静音，所以除了
  // 播放前设一次，播放开始后还要再设一次。
  player.addEventListener("playing", () => {
    unmute();
    // 仍然被压成静音时不再让用户自己去找音量键：给一个明确的按钮，点一下就是
    // 一次干净的用户手势，浏览器一定放行。
    $("pvSound").classList.toggle("on", player.muted || player.volume === 0);
  });
  $("pvSound").onclick = (e) => {
    e.stopPropagation();
    unmute();
    player.play().catch(()=>{});
    $("pvSound").classList.remove("on");
  };
  player.onloadedmetadata = () => {
    // 素材本身没有音轨时要说清楚，否则用户只会觉得「又没声音」
    const tracks = player.audioTracks ? player.audioTracks.length : null;
    if(tracks === 0 || player.mozHasAudio === false){
      toast("这条素材没有音轨", 3000);
      $("pvSound").classList.remove("on");
    }
  };
  unmute();
  player.play().catch(() => {
    player.muted = true;                 // 带声被拦就先静音放起来，别让画面卡住
    player.play().catch(()=>{});
    $("pvSound").classList.add("on");
  });
}
function closePreview(){
  $("pvMask").classList.remove("on");
  $("pvBody").innerHTML = "";      // 清空才会停掉正在播的视频/音频
}
// 只点蒙层本身才关：点到视频、控制条上不该把预览收掉。Esc 关闭统一在末尾的键盘监听里
$("pvMask").onclick = (e) => { if(e.target === $("pvMask")) closePreview(); };
// 缩略图默认只显示首帧图；鼠标移上去才把视频加载进来静音循环播放，指针离开就换回
// 首帧图。挑参考片时扫一遍就知道每条片子讲什么，同时几十条视频也不会一起开始下载。
function wireHoverPlay(box){
  if(!box || box.dataset.hoverPlay) return;
  box.dataset.hoverPlay = "1";
  const videoOf = (e) => {
    const holder = e.target.closest && e.target.closest(".thumb");
    return holder ? {holder, video: holder.querySelector("video")} : null;
  };
  box.addEventListener("mouseover", (e) => {
    const hit = videoOf(e);
    if(!hit || !hit.video) return;
    const v = hit.video;
    if(!v.getAttribute("src") && v.dataset.src) v.src = v.dataset.src;
    v.muted = true; v.loop = true;
    hit.holder.classList.add("playing");
    v.play().catch(() => hit.holder.classList.remove("playing"));
  });
  box.addEventListener("mouseout", (e) => {
    const hit = videoOf(e);
    if(!hit || !hit.video) return;
    if(hit.holder.contains(e.relatedTarget)) return;   // 还在同一张缩略图内部
    hit.holder.classList.remove("playing");
    hit.video.pause(); hit.video.currentTime = 0;
  });
}

/* ---------- 上传区 ---------- */
function renderUploads(){
  // 不能用 <label> 包住 file input：label 会把区域内任何点击都转发给 input，
  // 和显式 input.click() 撞在一起会让文件选择框开两次，选中的文件反而丢掉。
  $("uploads").innerHTML = KINDS.map(k => `
    <div class="slot" tabindex="${k.key === "product_images" ? "0" : "-1"}"
      title="${esc(k.tip + (k.key === "product_images" ? "；点击此区域后可直接粘贴商品图" : ""))}">
      <div class="slot-h"><span>${k.label}</span>
        <button type="button" class="ghost" data-clear="${k.key}" title="清空这一栏素材"
          hidden>清空</button>
        <button type="button" class="ghost" data-lib="${k.key}" title="从素材库挑">库</button>
        <button type="button" class="ghost" data-kind="${k.key}" title="上传">＋</button>
      </div>
      <input type="file" hidden data-input="${k.key}" ${k.multiple?"multiple":""} />
      <div class="thumbs" data-list="${k.key}"></div>
    </div>`).join("");
  KINDS.forEach(k => {
    const slot = document.querySelector(`.slot [data-kind="${k.key}"]`).closest(".slot");
    const input = document.querySelector(`input[data-input="${k.key}"]`);
    document.querySelector(`button[data-kind="${k.key}"]`).onclick = () => input.click();
    document.querySelector(`button[data-lib="${k.key}"]`).onclick = () => openLibrary(k.key);
    // 清空整栏：一张张点 × 太累，尤其商品图动辄挑十张。不弹确认——素材文件还在，
    // 重新挑一遍的成本远小于每次都被拦一下。逐条调 /remove，服务端不必先更新。
    document.querySelector(`button[data-clear="${k.key}"]`).onclick = async () => {
      const list = task ? [].concat(task.inputs[k.key] || []).filter(Boolean) : [];
      if(!list.length) return;
      try{
        for(const path of list){
          await api(`/tasks/${task.task_id}/remove`,
            {method:"POST", json:{kind:k.key, path:path}});
        }
        await refresh();
        toast(`已清空${k.label}（${list.length} 项）`);
      }catch(err){ toast("清空失败：" + err.message, 5000); }
    };
    // 必须先把 FileList 拷成数组再清 input.value：input.files 是活引用，清空 value
    // 就会把它清空。send() 第一个 await 之后才真正读文件，那时拿到的会是空列表，
    // 后端只能报「没有收到文件」400。
    input.onchange = () => {
      const picked = [...input.files];
      input.value = "";
      if(picked.length) send(k.key, picked);
    };
    // 整个槽位都是拖放区，不再画一个占版面的虚线框
    slot.ondragover = e => { e.preventDefault(); slot.classList.add("over"); };
    slot.ondragleave = () => slot.classList.remove("over");
    slot.ondrop = e => { e.preventDefault(); slot.classList.remove("over");
      const picked = [...e.dataTransfer.files];
      if(picked.length) send(k.key, picked); };
    if(k.key === "product_images"){
      slot.onpaste = e => {
        const items = e.clipboardData && e.clipboardData.items;
        if(!items) return;
        const pasted = [];
        [...items].forEach((item, i) => {
          if(!item.type.startsWith("image/")) return;
          const source = item.getAsFile();
          if(!source) return;
          const ext = (source.type.split("/")[1] || "png").replace("jpeg", "jpg");
          const name = source.name && source.name.includes(".")
            ? source.name : `pasted-product-${i + 1}.${ext}`;
          pasted.push(new File([source], name, {type: source.type}));
        });
        if(pasted.length){
          e.preventDefault();
          send(k.key, pasted);
        }
      };
    }
  });
}

// 品类关键词表：从商品名和卖点里认出品类，用来把同品类的参考片顶上来。
// 复刻时商品是被替换进去的，真正能复用的是卖点表达方式（品类决定）和分镜结构（形态决定）。
const CATEGORY_WORDS = {
  "3C数码": ["手机","耳机","耳塞","笔记本","电脑","平板","相机","充电","数码","音箱","音响",
    "键盘","鼠标","屏幕","手表","智能"],
  "服饰配饰": ["裙","上衣","衬衫","裤","外套","卫衣","鞋","靴","包","背包","围巾","项链","帽",
    "袜","穿搭","配饰","服装","女装","男装","套装"],
  "食品饮料": ["饮","茶","奶","咖啡","果汁","零食","糖","酒","水","饼","肉","食品","汤","粉",
    "面","米","坚果"],
  "美妆个护": ["霜","乳","精华","面膜","牙刷","牙膏","洗","护","彩妆","口红","唇","眼霜","洁面",
    "洗发","护发","香水","泥膜","防晒","个护"],
  "家居厨房": ["锅","铲","刀","碗","杯","插排","插座","灯","桌","椅","收纳","清洁","家居","厨房",
    "床","被","毛巾"],
  "出行交通": ["汽车","摩托","电动车","自行车","轮胎","头盔","骑行","车"],
};
// 同品类内的次序：纯商品展示片分镜最容易直接套用，剧情植入改造成本最高
const FORM_RANK = {"商品展示": 0, "卡点特效": 1, "剧情植入": 2};

function guessCategory(){
  const text = ($("pName").value + " " + $("pPoints").value).toLowerCase();
  if(!text.trim()) return "";
  let best = "", hits = 0;
  Object.entries(CATEGORY_WORDS).forEach(([cat, words]) => {
    const n = words.filter(w => text.includes(w.toLowerCase())).length;
    if(n > hits){ hits = n; best = cat; }
  });
  return best;
}
function renderHotVideos(){
  const files = lib.hot_videos || [];
  const want = guessCategory();
  $("libHint").textContent = want
    ? `已按「${want}」把贴合的参考片排在前面；选中后会自动带上最贴合的一组商品素材`
    : "填写商品名后会自动把同品类的参考片排在前面；选中后会自动带上最贴合的一组商品素材";
  if(!files.length){
    $("libCats").innerHTML = "";
    $("libFiles").innerHTML = `<div class="empty">爆款视频库暂无内容<br/><br/>
      请在素材库清单中为视频填写简短准确的中文描述</div>`;
    return;
  }
  // 左侧按品类收敛：33 条里同品类通常只有几条，点一下就不用在整库里翻
  const cats = [...new Set(files.map(f => f.category).filter(Boolean))];
  cats.sort((a, b) => (a === want ? -1 : b === want ? 1 : a.localeCompare(b, "zh")));

  $("libCats").innerHTML = [`<button data-cat="" class="${picked ? "" : "on"}">

      ${esc(c)}<em>${files.filter(f => f.category === c).length}</em></button>`)).join("");
  $("libCats").querySelectorAll("button").forEach(b => b.onclick = () => {
    libCat = b.dataset.cat; renderHotVideos();
  });
  const shown = files.map((file, index) => ({file, index}))
    .filter(x => !picked || x.file.category === picked);
  if(!picked && want){
    shown.sort((a, b) => (b.file.category === want) - (a.file.category === want)
      || (FORM_RANK[a.file.form] ?? 9) - (FORM_RANK[b.file.form] ?? 9)
      || a.index - b.index);
  }
  $("libFiles").innerHTML = `<div class="thumbs">` + shown.map(({file, index}) =>
    `<div class="thumb" data-use-hot="${index}" title="${esc(file.name)}">${mediaThumb(file)}
      ${!picked && want && file.category === want ? `<span class="fit">贴合</span>` : ""}
      <button class="x" data-zoom-hot="${index}" title="预览">⤢</button>
      <span class="cap">${esc(file.name)}${file.form ? ` · ${esc(file.form)}` : ""}</span>
      </div>`).join("") + `</div>`;
  wireHoverPlay($("libFiles"));
  $("libFiles").querySelectorAll("[data-use-hot]").forEach(el => el.onclick = async e => {
    const file = files[Number(el.dataset.useHot)];
    if(e.target.dataset.zoomHot !== undefined){ preview(libUrl(file.path), file.name); return; }
    await usePicked(file, "reference_video");
    await autofillMaterials(file);
  });

// 选中爆款视频时顺手把最贴合的一组商品素材填进去：选完片就能直接开跑，不用再翻一遍素材库。
// 打分口径：商品名跟素材包名对得上最重（用户已经说清楚要做什么了），其次是商品名推断出的
// 品类，最后才是参考片自己的品类。一个信号都没有就不填，别乱塞。
function scoreGroup(group, hot, name){
  const gn = (group.name || "").toLowerCase().replace(/\s+/g, "");
  let s = 0;
  if(name && gn){
    if(gn.includes(name) || name.includes(gn)) s += 100;
    else{
      // 名字对不上整段时按字面重合比例给分：「小米17 Pro Max」对「xiaomi 17 Pro Max」
      // 中文名和英文名混着写，只有数字和字母能对上，按比例才压得住品类那点分数
      const chars = [...new Set(gn.replace(/[^0-9a-z\u4e00-\u9fa5]/g, ""))];
      if(chars.length){
        s += Math.round(chars.filter(ch => name.includes(ch)).length / chars.length * 60);
      }
    }
  }
  const want = guessCategory();
  if(want && group.category === want) s += 30;
  if(hot.category && group.category === hot.category) s += 10;
  return s;
}
async function autofillMaterials(hot){
  // 参考片没登记成功（比如 usePicked 报错）就别接着填；素材位已经有东西也不覆盖用户的选择
  if(!task || !editable() || task.inputs.reference_video !== hot.path) return;
  if(["product_images", "user_videos"].some(k =>
    [].concat(task.inputs[k] || []).filter(Boolean).length)) return;
  let groups = [];
  try{
    // 爆款视频库走的是独立接口，手上没有参考素材包，这里单独取一次整库
    groups = ((await api("/library")).reference_groups || []).filter(g =>
      (g.materials || []).some(m => m.kind === "product_images"));
  }catch(e){ return; }
  const name = ($("pName").value || "").trim().toLowerCase().replace(/\s+/g, "");
  const best = groups.map(g => ({g, s: scoreGroup(g, hot, name)}))
    .sort((a, b) => b.s - a.s)[0];
  if(!best || best.s <= 0) return;
  const items = best.g.materials.filter(m =>
    m.kind === "product_images" || m.kind === "user_videos");
  if(!items.length) return;
  try{
    for(const item of items){
      await api(`/tasks/${task.task_id}/pick`,
        {method:"POST", json:{kind:item.kind, path:item.path}});
    }
    await refresh();
    const imgs = items.filter(x => x.kind === "product_images").length;
    const vids = items.length - imgs;
    toast(`已按「${best.g.name}」自动填入 ${imgs} 张商品图${
      vids ? ` + ${vids} 个视频素材` : ""}，不合适点素材栏的「清空」`, 6000);
  }catch(e){ toast("自动填素材失败：" + e.message, 5000); }
}
function renderReferenceGroups(all){
  const want = guessCategory();
  const picked = typeof libCat === "string" ? libCat : "";
  const cats = [...new Set(all.map(g => g.category).filter(Boolean))];
  cats.sort((a, b) => (a === want ? -1 : b === want ? 1 : a.localeCompare(b, "zh")));
  $("libCats").innerHTML = all.length ? [`<button data-cat="" class="${picked ? "" : "on"}">

    .concat(cats.map(c => `<button data-cat="${esc(c)}" class="${picked === c ? "on" : ""}">

/* ---------- 任务读写 ---------- */
// 只有还没跑过的草稿任务才允许被改。跑过的任务是一次复刻的完整记录：素材、商品信息、
// 成片必须对得上，往里面塞新素材或改商品名会让记录和产物对不上。
function editable(){
  return !!task && task.status === "draft" && !task.running;
}
// 开一条全新任务：商品信息取页面当前值，素材沿用 source 里已登记的那几个文件（只登记
// 路径不复制），source 自己连一个字段都不改，产物和日志保持原样。
async function spawnTask(source){
  const inputs = source ? KINDS.map(k => {
    const value = source.inputs[k.key];
    return {kind:k.key, paths:k.multiple ? (value || []) : (value ? [value] : [])};
  }) : [];
  // 自动名里嵌着老任务建任务的时刻，照搬过去新任务显示的还是老时间（比如凌晨改的还写
  // 着前一天 23:37）。所以只把用户手起的名字带过去，自动名一律置空让后端按新任务重算。
  const keepTitle = !source || source.title_auto === false;
  const fresh = await api("/tasks", {method:"POST", json:{product: currentProduct(),
    options: currentOptions(), title: keepTitle ? currentTitle() : ""}});
  const prev = task;
  task = fresh;
  try{
    for(const group of inputs){
      for(const path of group.paths){
        await api(`/tasks/${task.task_id}/pick`,
          {method:"POST", json:{kind:group.kind, path:path}});
      }
    }
    await loadTaskList();
    $("taskPick").value = task.task_id;
    task = await api(`/tasks/${task.task_id}`);
    overview = null;
    stepPick = "";
    fillForm(); render(); renderOverview();
    return task;
  }catch(e){
    task = prev;
    await loadTaskList();
    $("taskPick").value = prev ? prev.task_id : "";
    throw e;
  }
}
async function ensureTask(){
  if(editable()) return task;
  return spawnTask(task);
}
// 跑过的任务是只读记录。用户一改东西就先分叉出一条草稿（素材照搬过来），改动落在草稿上，
// 老任务的素材、商品信息、产物一个字都不动。并发的输入事件共用同一次分叉。
let forking = null;
async function forkIfNeeded(){
  if(editable()) return task;
  if(!forking){
    forking = spawnTask(task).then(fresh => {
      toast("已另开一条草稿任务，之前那次复刻保持原样", 4000);
      return fresh;
    }).finally(() => { forking = null; });
  }
  return forking;
}
const MD5_SHIFT = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
  5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
  4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
  6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
const MD5_K = Array.from({length:64}, (_, i) =>
  Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0);
function md5Block(state, data, offset){
  const rotate = (value, bits) => (value << bits) | (value >>> (32 - bits));
  const words = Array.from({length:16}, (_, i) => data[offset + i * 4] |
    (data[offset + i * 4 + 1] << 8) | (data[offset + i * 4 + 2] << 16) |
    (data[offset + i * 4 + 3] << 24));
  let [a, b, c, d] = state;
  for(let i = 0; i < 64; i++){
    let f, g;
    if(i < 16){ f = (b & c) | (~b & d); g = i; }
    else if(i < 32){ f = (d & b) | (~d & c); g = (5 * i + 1) % 16; }
    else if(i < 48){ f = b ^ c ^ d; g = (3 * i + 5) % 16; }
    else{ f = c ^ (b | ~d); g = (7 * i) % 16; }
    const next = (b + rotate((a + f + MD5_K[i] + words[g]) | 0, MD5_SHIFT[i])) | 0;
    a = d; d = c; c = b; b = next;
  }
  state[0] = (state[0] + a) | 0; state[1] = (state[1] + b) | 0;
  state[2] = (state[2] + c) | 0; state[3] = (state[3] + d) | 0;
}
function md5Finish(state, rest, totalSize){
  const tail = new Uint8Array(rest.length < 56 ? 64 : 128);
  tail.set(rest); tail[rest.length] = 0x80;
  const view = new DataView(tail.buffer);
  view.setUint32(tail.length - 8, (totalSize * 8) >>> 0, true);
  view.setUint32(tail.length - 4, Math.floor(totalSize / 0x20000000), true);
  for(let i = 0; i < tail.length; i += 64) md5Block(state, tail, i);
  return state.map(value => [0,8,16,24].map(shift =>
    ((value >>> shift) & 255).toString(16).padStart(2, "0")).join("")).join("");
}
async function fileMd5(file){
  toast("正在校验素材：" + file.name, 3000);
  const state = [0x67452301, -271733879, -1732584194, 0x10325476];
  const chunkSize = 4 << 20;
  let rest = new Uint8Array(0);
  for(let offset = 0; offset < file.size; offset += chunkSize){
    const chunk = new Uint8Array(await file.slice(offset, offset + chunkSize).arrayBuffer());
    const data = new Uint8Array(rest.length + chunk.length);
    data.set(rest); data.set(chunk, rest.length);
    const complete = data.length - data.length % 64;
    for(let pos = 0; pos < complete; pos += 64) md5Block(state, data, pos);
    rest = data.slice(complete);
  }
  return md5Finish(state, rest, file.size);
}
async function send(kind, files){
  await ensureTask();
  const picked = [...files], names = picked.map(f=>f.name).join("、");
  try{
    let reused = 0;
    const media = (KINDS.find(item => item.key === kind) || {}).media;
    if((media === "video" || media === "image") && meta && meta.md5_dedupe){
      for(const file of picked){
        const md5 = await fileMd5(file);
        let hit = {found:false};
        try{
          const checkPath = media === "video" ? "video-by-md5" : "file-by-md5";
          const query = `?md5=${md5}&size=${file.size}` +
            (media === "video" ? "" : `&media=${media}`);
          hit = await api(`/library/${checkPath}${query}`);
        }catch(e){
          // 兼容尚未重启的旧服务：旧服务没有 MD5 查询接口，仍允许正常上传。
          if(!/HTTP 404|返回不是 JSON/.test(e.message)) throw e;
        }
        if(hit.found){
          await api(`/tasks/${task.task_id}/pick`,
            {method:"POST", json:{kind:kind, path:hit.path}});
          reused += 1;
        }else{
          await upload(kind, [file], {md5:md5, size:file.size});
        }
      }
    }else{
      // 旧服务没有 MD5 能力时直接走原始上传，避免为多文件请求复用错误的指纹。
      await upload(kind, picked);
    }
    await refresh();
    toast(reused === picked.length ? "素材已存在，已直接复用：" + names
      : reused ? `已上传并复用（${reused} 个素材已存在）` : "已上传：" + names);
  }catch(e){ toast("上传失败：" + e.message, 6000); }
}
// 视频动辄上百 MB，用 XHR 才能给上传进度，fetch 没有 upload 事件
function upload(kind, files, fingerprint=null){
  return new Promise((resolve, reject) => {
    const fd = new FormData();
    fd.append("kind", kind);
    if(fingerprint){
      fd.append("md5", fingerprint.md5);
      fd.append("size", fingerprint.size);
    }
    [...files].forEach(f => fd.append("file", f));
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `/api/tasks/${task.task_id}/upload`);
    if(token()) xhr.setRequestHeader("Authorization", "Bearer " + token());
    xhr.upload.onprogress = e => { if(e.lengthComputable)
      toast(`上传中 ${Math.round(e.loaded/e.total*100)}%`, 1500); };
    xhr.onload = () => {
      let body = {}; try{ body = JSON.parse(xhr.responseText || "{}"); }catch(_){}
      xhr.status < 300 ? resolve(body) : reject(new Error(body.error || ("HTTP " + xhr.status)));
    };
    xhr.onerror = () => reject(new Error("网络中断或文件超过上限"));
    xhr.send(fd);
  });
}
async function save(){
  // 跑过的任务只读：先分叉出草稿，改动写到草稿上，老任务保持原样
  if(task && !editable()) await forkIfNeeded();
  await ensureTask();
  task = await api(`/tasks/${task.task_id}`, {method:"PATCH",
    json:{product: currentProduct(), options: currentOptions(), title: currentTitle()}});
  $("taskTitle").value = task.title || "";   // 清空后后端重算了默认名，回填让用户看见
  await loadTaskList();
  render();
  return task;
}
async function refresh(){
  if(!task) return null;
  const taskId = task.task_id;
  const fresh = await api(`/tasks/${taskId}`);
  // 任务切换后，旧任务的轮询请求可能才返回；不能让它覆盖当前页面。
  if(!task || task.task_id !== taskId || $("taskPick").value !== taskId) return null;
  task = fresh;
  render();
  return task;
}
function statusBadge(){
  const el = $("status");
  el.className = "badge " + statusClass(task);
  el.textContent = statusText(task);
}
function render(){
  renderFiles(); statusBadge();
  if(!task){
    $("steps").innerHTML = ""; $("stepNow").innerHTML = ""; $("errLine").textContent = "";
    $("logHead").textContent = ""; $("log").textContent = "等待任务…";
    $("taskTitle").title = "改完回车生效；清空回到「时间戳 · 商品名」";
    renderResult(); renderOverview();
    return;
  }
  // 任务号、创建时间、复刻强度这些放 title：需要时 hover 就有，不必长期占版面
  $("taskTitle").title = `${task.task_id}\n建于 ${task.created_at}\n` +
    (task.options.rewrite_mode === "strict" ? "严格复刻" : "创意仿写");
  const steps = meta ? meta.steps.filter(s => s.key !== "ingest") : [];
  const state = (s) => {
    const st = task.steps[s.key] || {};
    return st.status === "done" ? "done" : st.status === "failed" ? "fail" :
      st.status === "running" ? "run" : "";
  };
  $("steps").innerHTML = steps.map(s => {
    const st = task.steps[s.key] || {};
    const info = st.status === "done" ? summary(s.key, st) : "";
    // 耗时跟在步骤名后面用小字，跑着的步骤用服务端算的 elapsed，别拿浏览器时钟去减
    const sec = st.status === "running" ? st.elapsed : st.sec;
    return `<li class="${state(s)}${stepPick === s.key ? " sel" : ""}" data-step="${s.key}"
      title="${esc(s.title + (info ? "：" + info : "") +
      (st.started_at ? "\n开始 " + st.started_at : "") + "\n点一下看这步的信息")}"><i></i>
      <span class="nm">${esc(s.short || s.title)}${
        sec == null ? "" : `<em>${esc(fmtSec(sec))}</em>`}</span></li>`;
  }).join("");
  $("steps").querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    stepPick = stepPick === el.dataset.step ? "" : el.dataset.step;   // 再点一下收起
    render();
  });
  // 一句话总览：现在在哪一步、这步跑了多久、总共几步、累计耗时
  const cur = steps.find(s => state(s) === "run") || steps.find(s => state(s) === "fail")
    || [...steps].reverse().find(s => state(s) === "done");
  const done = steps.filter(s => state(s) === "done").length;
  const total = steps.reduce((a, s) => a + (Number((task.steps[s.key]||{}).sec) || 0), 0);
  // 默认跟着当前步骤走；点了某一步就显示那一步的信息
  const shown = (stepPick && steps.find(s => s.key === stepPick)) || cur;
  if(shown){
    const st = task.steps[shown.key] || {};
    // 正在跑不写「进行中」：左边呼吸灯已经说明了。每步耗时在进度轨上，这里只留总览
    const info = st.status === "done" ? summary(shown.key, st)
      : st.status === "failed" ? (st.error || "失败")
      : st.status === "running" ? "" : "待运行";
    $("stepNow").innerHTML = `<span class="dot ${state(shown)}"></span>
      <b>${esc(shown.title)}</b><span class="si">${info ? esc(info) : ""}</span>
      <span class="tail">${done}/${steps.length}${
        total ? " · 累计 " + esc(fmtSec(total)) : ""}</span>`;
  }else if(task.step === "ingest"){
    $("stepNow").innerHTML = `<span class="dot run"></span><b>准备素材</b>`;
  }else{
    $("stepNow").innerHTML = `<span class="dot"></span><b>待运行</b>`;
  }
  // 失败原因单独一行：进度轨塞不进长错误信息，但它必须显眼
  const failed = steps.map(s => [s, task.steps[s.key] || {}])
    .filter(([,st]) => st.status === "failed");
  $("errLine").innerHTML = failed.length
    ? failed.map(([s,st]) => `${esc(s.title)}：${esc(st.error||"")}`).join("<br/>")
    : (task.error ? esc(task.error) : "");
  if($("resetStep").options.length !== steps.length)
    $("resetStep").innerHTML = steps.map(s=>`<option value="${s.key}">${s.title}</option>`).join("");
  // 日志只属于当前这条任务；把任务名和行数标出来，免得看着像混进了上一条任务的记录
  const logs = task.logs || [];
  $("logHead").textContent = `${task.title} · ${task.task_id} · ${logs.length} 行`;
  $("log").textContent = logs.slice(-200).join("\n") || "等待任务…";
  $("log").scrollTop = 1e6;
  renderResult();
}
function summary(key, st){
  if(key === "reference") return `${st.shots} 镜 / ${st.duration_sec}s`;
  if(key === "audio") return `${st.策略}（BGM ${st.有背景音乐?"有":"无"} · 口播 ${st.有人声口播?"有":"无"}）`;
  if(key === "product") return st.product ? `${st.product}${st.images?` · 商品图 ${st.images} 张`:""}${st.harvested?"（素材抽帧补齐）":""}` : "";
  if(key === "materials") return `${st.segments} 个可用片段`;
  if(key === "script") return `${st.shots} 镜 / ${st.segments} 段`;
  if(key === "match") return Object.entries(st.stat||{}).map(([k,v])=>`${k}${v}镜`).join("、");
  if(key === "generate") return `${st.generated}/${st.planned} 段 · ${(st.modes||[]).join("/")}`;
  if(key === "compose") return `成片 ${st.duration_sec}s`;
  return "";
}
function renderResult(){
  const r = task && task.result, box = $("resultBox");

    box.innerHTML = `<div class="empty">尚无成片</div>`;

  if(box.dataset.src !== url){
    box.dataset.src = url;
    // 下载走 download=1：成片默认内联播放，不加这个参数点了只会在标签页里打开

    box.innerHTML = `<video id="player" controls preload="metadata" src="${url}"
        style="max-height:52vh;width:auto;margin:0 auto"></video>

        <a class="btn-dl" href="${url}&download=1" download="${esc(name)}">下载</a></div>`;
  }
  // 音轨那句话很长（「整轨复用：参考片只有 BGM 没有口播…」），一行只留冒号前的结论，

  const audio = String(r.audio.note || "");

  const meta = $("resultMeta");

  meta.title = `时长 ${r.duration_sec}s\n用到 ${r.segments_used}/${r.segments_planned} 段\n` +
    `音轨：${audio}\n字幕：${r.subtitles.enabled
      ? (r.subtitles.burned ? "已烧入 " + r.subtitles.lines + " 条"
        : (r.subtitles.note || "仅 SRT")) : "未开启"}`;
}

/* ---------- 关键信息 ---------- */
const fact = (title, body) => body ? `<div class="fact"><h4>${esc(title)}</h4><div>${body}</div></div>` : "";
const chips = (arr) => `<div class="chips">` +
  (arr||[]).map(v => `<span class="chip">${esc(v)}</span>`).join("") + `</div>`;
// 中间产物的字段值形态很杂：字符串、字符串数组、对象数组、嵌套对象都有。
// 统一在这里降解成可读的行，免得到处 JSON.stringify 糊一坨给用户看。
function val(v, depth=0){
  if(v == null || v === "") return "";
  if(typeof v === "boolean") return v ? "是" : "否";
  if(typeof v !== "object") return esc(v);
  if(Array.isArray(v)){
    if(!v.length) return "";
    if(v.every(x => x == null || typeof x !== "object")) return chips(v);
    return `<div class="rows">` +
      v.map(x => `<div class="sub">${val(x, depth+1)}</div>`).join("") + `</div>`;
  }
  const kv = Object.entries(v).filter(([,x]) =>
    x != null && x !== "" && !(Array.isArray(x) && !x.length));
  if(!kv.length) return "";
  if(depth >= 3) return esc(JSON.stringify(v, null, 2));
  return `<div class="rows">` + kv.map(([k,x]) =>
    `<div class="kvline"><span class="sk">${esc(k)}</span><span>${val(x, depth+1)}</span></div>`)
    .join("") + `</div>`;
}
// 拆解和剧本里的空值大多是「无」「不确定」这种字而不是空串，照样铺出来全是噪音
const NOISE = new Set(["无", "没有", "不确定", "暂无", "无台词", "-", "空"]);
const meaningful = (v) => v != null && v !== "" && !NOISE.has(String(v).trim());
// 人物是对象数组（谁/外形服装/表情情绪/视线朝向），摊成一行「谁（外形；表情）」，
// 否则 chips 里直接出 [object Object]
function personText(v){
  return [].concat(v || []).map(x => {
    if(!x || typeof x !== "object") return meaningful(x) ? String(x) : "";
    const more = ["外形服装", "表情情绪", "视线朝向"].map(k => x[k]).filter(meaningful).join("；");
    const who = x["谁"] || x["角色"] || x["编号"] || "";
    return more ? `${who}（${more}）` : String(who || "");
  }).filter(Boolean).join(" / ");
}
// 分镜行：参考片拆解和生成剧本的分镜字段名不完全一样，公共部分抽出来。
// tagKeys 走底部胶囊（景别、运镜这类短词），rowKeys 走键值行（成句的描述）。
function shotHtml(x, i, tagKeys, rowKeys = []){
  const time = x["开始时间"] != null && x["结束时间"] != null
    ? `${esc(x["开始时间"])}–${esc(x["结束时间"])}` : "";
  const dur = x["时长秒"] != null ? esc(x["时长秒"]) + "s" : "";
  const says = [].concat(x["台词"] || []).filter(meaningful);
  const rows = rowKeys.map(k => [k, k === "人物" ? esc(personText(x[k]))
    : (meaningful(x[k]) ? val(x[k]) : "")]).filter(([, v]) => v);
  const tags = tagKeys.map(k => x[k]).filter(v => typeof v !== "boolean")
    .filter(meaningful).flat().filter(meaningful);
  if(x["需要模特出镜"] === true) tags.push("需模特出镜");
  const ref = x["对应参考镜"] != null ? "参考镜 " + x["对应参考镜"] : "";
  return `<div class="shot">
    <div class="shot-h"><span class="no">${esc(x["序号"] ?? i + 1)}</span>
      <span class="t">${[time, dur, ref].filter(Boolean).map(esc).join(" · ")}</span>
      ${meaningful(x["叙事功能"]) ? `<span class="role">${esc(x["叙事功能"])}</span>` : ""}</div>
    ${x["画面"] ? `<div class="pic">${esc(x["画面"])}</div>` : ""}
    ${says.length ? `<div class="say">${esc(says.join(" / "))}</div>` : ""}
    ${meaningful(x["花字"]) ? `<div class="say">花字：${esc(x["花字"])}</div>` : ""}
    ${x["视频提示词"] ? `<p>${esc(x["视频提示词"])}</p>` : ""}
    ${rows.map(([k, v]) =>
      `<div class="kvline"><span class="sk">${esc(k)}</span><span>${v}</span></div>`).join("")}
    ${tags.length ? chips(tags) : ""}</div>`;
}

// 真正进了生成的商品图：按分镜级选图（shot_refs）反推，而不是看事实卡的 images。
// images 是「选中 + 落选」的全量（product_facts 故意不丢落选图），全局参考图又只是候选，
// 最后哪几张被镜头引用要看 shot_refs：全局落选的图分镜可以再取用（取用时补体检），
// 全局选中的图也可能一个镜头都没用上。文件一律取「最终」，也就是体检改造后的那张。
function usedProductImages(p, sr){
  const fileOf = {}, fixed = new Set();
  (p["商品图明细"] || []).forEach(d => {
    if(d["编号"] != null) fileOf[d["编号"]] = d["文件"] || d["原图"];
  });
  [].concat(p["商品图检查"] || [], (sr || {})["选中补体检"] || []).forEach(c => {
    if(c["编号"] != null && c["最终"]) fileOf[c["编号"]] = c["最终"];
    if(c["最终"] && c["原图"] && c["最终"] !== c["原图"]) fixed.add(c["最终"]);
  });
  const shots = (sr || {})["分镜"] || {}, byNo = new Map(), states = new Map();
  Object.keys(shots).sort((a, b) => Number(a) - Number(b)).forEach(no => {
    const s = shots[no] || {};
    (s["参考图编号"] || []).forEach(n => {
      if(!byNo.has(n)) byNo.set(n, []);
      byNo.get(n).push(no);
    });
    // 状态图：某个镜头需要的中间状态（比如「抠掉 logo 的背面」），基于参考图现改的。
    // 有 url 才算真备好了：改不出来的会只留轮次记录，来源里写「放弃中间图」。
    // 同一张状态图常被好几镜共用，按文件合并；核验命中已有商品图时文件会跟参考图重合，
    // 那种情况在下面按文件去重，不重复铺一张。
    const mid = s["中间图"] || {};
    if(mid["url"] && mid["文件"]){
      const d = states.get(mid["文件"]) || {shots: [], want: mid["关键状态"] || ""};
      d.shots.push(no);
      states.set(mid["文件"], d);
    }
  });
  const refs = [...byNo.keys()].sort((a, b) => a - b).filter(n => fileOf[n]).map(n => ({
    file: fileOf[n], tag: "图" + n, fixed: fixed.has(fileOf[n]),
    tip: "用于分镜 " + byNo.get(n).join("、") + (fixed.has(fileOf[n]) ? "\n体检后的改造图" : "")}));
  const seen = new Set(refs.map(x => x.file));
  return refs.concat([...states].filter(([f]) => !seen.has(f)).map(([f, d]) => ({
    file: f, tag: "状态图·镜" + d.shots[0], fixed: true,
    tip: "镜 " + d.shots.join("、") + " 的中间状态图" + (d.want ? "：" + d.want : "")})));
}

      p["category"] ? `<em>${esc(p["category"])}</em>` : ""}</div>
    ${p["copy"] ? `<p class="pcard-copy">${esc(p["copy"])}</p>` : ""}
    ${points.length ? `<div class="pcard-sec"><h4>卖点</h4><ul class="plist">${

    ${p["商品图来源"] ? `<div class="pfoot">商品图来源：${esc(p["商品图来源"])}${
      idle ? `；未用上的 ${idle} 张留在任务里，重跑分镜选图时还可能被取用` : ""}</div>` : ""}

  $("pane-product").querySelectorAll("[data-pv]").forEach(el => el.onclick = () =>
    preview(libUrl(el.dataset.pv), el.dataset.pv.split("/").pop()));
}

    <div class="timeline">` + segs.map(s => {

      const sub = [s.mode, s["时长秒"] != null ? s["时长秒"] + "s" : "",
                   (s["用户素材镜头"]||[]).length ? "素材" + s["用户素材镜头"].length : "",
                   (s["AI补片镜头"]||[]).length ? "AI" + s["AI补片镜头"].length : ""]
                  .filter(Boolean).join(" · ");

        ? `<video src="${fileUrl(s.path)}" preload="metadata" muted playsinline></video>`

// 只认带 data-p 的按钮——「刷新」也在 tabs 里，别把它当成标签。
function wireTabs(id){
  const btns = [...document.querySelectorAll(`#${id} button[data-p]`)];
  btns.forEach(b => b.onclick = () => {
    btns.forEach(x => x.classList.toggle("on", x === b));
    btns.forEach(x => $("pane-" + x.dataset.p).classList.toggle("on", x === b));
  });
}
wireTabs("inTabs"); wireTabs("ovTabs");

// status 是 running 但后台线程已经不在的，是服务重启前留下的任务：它跑不完了，
// 但素材、日志、已出的中间产物都还在，必须照常列出来供查看和删除，不能悄悄藏掉。
// running 只有在服务端明确报 false 时才算线程不在；字段缺失（旧服务不返回）按在跑处理，
// 否则会把正在出片的任务误判成中断。
function statusText(t){
  if(!t) return "未开始";
  if(t.status === "running") return t.running === false ? "已中断" : "运行中";
  return {draft: "待运行", completed: "已完成", failed: "失败"}[t.status] || t.status;
}
function statusClass(t){
  if(!t) return "idle";
  if(t.status === "running") return t.running === false ? "err" : "";
  return {draft: "idle", completed: "ok", failed: "err"}[t.status] || "idle";
}
async function loadTaskList(){
  const list = await api("/tasks");
  const pick = $("taskPick");
  pick.innerHTML = `<option value="">— 新建任务 —</option>` + list.map(t =>
    `<option value="${t.task_id}">${esc(t.title)} · ${statusText(t)}</option>`).join("");
  if(task) pick.value = task.task_id;
}
function fillForm(){
  if(!task) return;
  $("taskTitle").value = task.title || "";
  $("pName").value = task.product.name || "";
  $("pPoints").value = (task.product.selling_points||[]).join("\n");
  setMode(task.options.rewrite_mode || "creative");
  renderOpts();
}
function startPolling(){
  clearInterval(timer);
  timer = setInterval(async () => {
    if(!task) return;
    try{
      const beforeTaskId = task.task_id;
      const before = task.status, beforeStep = task.step;
      const fresh = await refresh();
      if(!fresh || fresh.task_id !== beforeTaskId) return;
      if(before !== fresh.status || beforeStep !== fresh.step){
        // 只在步骤边界上重新拉：overview 需要读盘，不适合每 2.5s 一次
        loadOverview(fresh.task_id);
      }
      if(before !== fresh.status && fresh.status === "completed") toast("成片已生成");
    }catch(e){ console.error("轮询/渲染出错", e); }
  }, 2500);
}

$("btnNew").onclick = () => {

$("taskPick").onchange = async (e) => {
  const taskId = e.target.value;

  clearTimeout(productSaveTimer);

  try{

// 重命名：没有任务时提示而不是静默返回，否则用户会以为「改了没反应」。
// 改名对跑过的任务也放行——名字不参与复刻，改了不会让记录和产物对不上。
async function rename(){
  if(!task){ toast("先上传素材建任务，名字会带过去"); return; }
  try{
    const running = task.running;                 // PATCH 的响应里没有 running，别丢掉
    task = await api(`/tasks/${task.task_id}`, {method:"PATCH", json:{title: currentTitle()}});
    task.running = running;
    $("taskTitle").value = task.title || "";
    await loadTaskList();
    $("taskPick").value = task.task_id;           // 重建下拉后把选中项设回来
    render();
    toast("已改名：" + task.title);
  }catch(e){ toast("改名失败：" + e.message, 5000); }
}
$("taskTitle").onchange = rename;

  try{
    if(live) toast("正在终止任务，请稍候…", 8000);
    const res = await api("/tasks/" + id, {method:"DELETE"});
    localStorage.removeItem("vf_task");
    $("btnNew").onclick();
    await loadTaskList();
    toast(res.cancelled ? "已终止并删除：" + name : "已删除：" + name);
  }catch(e){ toast("删除失败：" + e.message, 6000); }
};
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
  setMode(b.dataset.v); if(task) save();
});
$("btnRun").onclick = async () => {
  try{
    if(!task || !task.inputs.reference_video){
      toast("请先给出爆款参考视频"); return;
    }
    // 商品图不是硬要求：没有商品图时 product_facts 会走 harvest_product_images，
    // 从商品视频里抽商品帧再生成白底图，所以两者给一个就能跑。
    if(!(task.inputs.product_images||[]).length && !(task.inputs.user_videos||[]).length){
      toast("商品图和商品视频至少给一个：没有商品图会从商品视频里抽帧补齐", 5000); return;
    }
    // 跑过的任务不再复用：另开一条任务从头跑，老任务的素材、日志、成片一律不动。
    // 当前就是还没跑过的草稿时直接用它，免得每点一次就多出一条空任务。
    const fresh = editable();
    if(!fresh) task = await spawnTask(task);
    await api(`/tasks/${task.task_id}/run`, {method:"POST", json:{}});
    toast(fresh ? "已开始，约数分钟" : "已另开一条新任务并开始复刻，约数分钟");
    await refresh();
  }catch(e){ toast("启动失败：" + e.message, 5000); }
};
$("btnReset").onclick = async () => {
  if(!task) return;
  // 重跑会覆盖这个任务已有的产物，属于对历史记录的改动，先问一句
  const step = $("resetStep").selectedOptions[0];
  if(!editable() && !confirm(`从「${step ? step.textContent : $("resetStep").value}」重跑「${
    task.title}」？\n\n这一步之后的中间结果和成片会被覆盖。想保留这次记录就点取消，` +
    `改完素材直接点「开始复刻」，会另开一条新任务。`)) return;
  try{
    task = await api(`/tasks/${task.task_id}/reset`, {method:"POST", json:{step:$("resetStep").value}});
    stepPick = "";
    render(); toast("已重置");
  }catch(e){ toast(e.message, 5000); }
};
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closePreview(); $("libMask").classList.remove("on"); }
});
// 前端出错时必须让用户看见，否则页面只是「点了没反应」
window.addEventListener("error", e => toast("前端异常：" + (e.message || e.type), 6000));
window.addEventListener("unhandledrejection", e =>
  toast("请求失败：" + ((e.reason && e.reason.message) || e.reason), 6000));

(async function init(){
  // 支持把口令直接写在链接里：http://<host>:<port>/?token=xxx
  // trim 很有必要：从聊天记录里复制链接常把后面的标点、说明文字一起带进来，
  // 那样口令是错的，而且会被写进 localStorage，之后每次刷新都 401。
  const fromUrl = (new URLSearchParams(location.search).get("token") || "").trim();
  // 口令留在地址栏：这个链接要能直接复制给别人用，抹掉之后复制过去打开就是 401。
  // 代价是它会进浏览器历史，所以别把链接发到公开群里。
  if(fromUrl) localStorage.setItem("vf_token", fromUrl);
  accessToken = fromUrl || localStorage.getItem("vf_token") || "";
  try{
    const draft = JSON.parse(sessionStorage.getItem("vf_product_draft") || "{}");
    $("pName").value = draft.name || "";
    $("pPoints").value = draft.points || "";
  }catch(_){}
  // 界面骨架先渲染出来：/meta 失败时至少上传区还能用，而不是留一个空白页。
  renderUploads(); renderOpts();
  try{
    meta = await api("/meta");
  }catch(e){
    const auth = /未授权|401/.test(e.message);
    if(auth) localStorage.removeItem("vf_token");    // 错口令别留着毒下一次刷新
    $("errLine").textContent = auth
      ? "访问口令无效，请通过带 ?token= 的链接重新打开"
      : "连不上后端：" + e.message;
    toast(auth ? "访问口令无效，请通过带 ?token= 的链接重新打开" : "连不上后端：" + e.message, 8000);
    return;
  }
  setMode(meta.default_options.rewrite_mode);
  applyBg();
  $("fontHint").textContent = meta.subtitle_font ? "字幕字体就绪" : "无中文字体，字幕只出 SRT";
  await loadTaskList();
  const last = localStorage.getItem("vf_task");
  if(last){
    try{ task = await api("/tasks/" + last); $("taskPick").value = last; fillForm(); }
    catch(e){ localStorage.removeItem("vf_task"); }   // 任务被删过，别一直报错
  }
  render(); startPolling();
  if(task){ loadOverview(); }
  setInterval(() => { if(task) localStorage.setItem("vf_task", task.task_id); }, 1500);
})();

</script>
