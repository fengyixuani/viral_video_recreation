<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralForge 能力与优化清单</title>
<style>
:root{
  --bg:#0f1116; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e6e8ee; --dim:#9aa3b2; --dim2:#6b7484;
  --acc:#5b9cff; --ok:#3ecf8e; --warn:#f0a020; --purple:#a67bff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:32px 20px 80px}
header h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
header .sub{color:var(--dim);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:24px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--acc)}
.stat span{color:var(--dim);font-size:13px}
nav.tabs{display:flex;gap:6px;margin:28px 0 18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button.on{color:var(--fg);border-bottom-color:var(--acc)}
section{display:none}
section.on{display:block}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
.bar input{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
  border-radius:6px;padding:7px 10px;font-family:inherit;font-size:14px;min-width:200px}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0b1020;font-weight:600}
.count{color:var(--dim2);font-size:13px;margin-left:auto}
.flow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 22px}
.flow h3{margin:0 0 4px;font-size:16px}
.flow .note{color:var(--dim);font-size:13px;margin:0 0 12px}
.steps{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.step{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:96px}
.step em{display:block;color:var(--dim2);font-size:11px;font-style:normal}
.step b{font-size:13px;font-weight:600}
.step span{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h4{margin:0;font-size:15px}
.card .file{color:var(--dim2);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.card p{margin:8px 0 0;color:var(--dim);font-size:13.5px}
.card ul{margin:8px 0 0;padding-left:18px;color:var(--dim);font-size:13.5px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;
  border:1px solid var(--line);color:var(--dim);margin:8px 6px 0 0}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:20px}
.item{position:relative;margin:0 0 20px}
.item:before{content:"";position:absolute;left:-27px;top:8px;width:10px;height:10px;
  border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.item.mech:before{background:var(--ok)}
.item.spec:before{background:var(--purple)}
.item .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .hd b{font-size:15.5px}
.item .date{color:var(--dim2);font-size:12px}
.item .kind{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--dim)}
.item .body{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-top:8px}
.item .row{display:flex;gap:10px;margin:0 0 6px;font-size:13.5px}
.item .row:last-child{margin-bottom:0}
.item .row i{flex:0 0 46px;font-style:normal;color:var(--dim2);font-size:12px;padding-top:2px}
.item .row div{color:var(--dim);flex:1}
.item .row div b{color:var(--fg);font-weight:600}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:#cbd3e1}
.empty{color:var(--dim2);padding:30px;text-align:center}
footer{color:var(--dim2);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

<script>

 {r:"第十四轮",d:"08-18",k:"口径收敛",t:"口播/字幕链路系统性修正（含回滚自己的 bad case 补丁）",

/* ===== 渲染 ===== */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KMAP={"根因修复":"","通用机制":"mech","口径收敛":"spec"};

$("#stats").innerHTML=STATS.map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

$("#tab-flow").innerHTML=FLOWS.map(f=>`<div class="flow"><h3>${f.name}</h3>
  <div class="steps">${f.steps.map(([i,n,d])=>`<div class="step"><em>${i}</em><b>${n}</b><span>${d}</span></div>`).join("")}</div>
  <p class="note" style="margin-top:12px;margin-bottom:0">${f.note}</p></div>`).join("");

const LAYERS=[...new Set(CAPS.map(c=>c.L))];
let capL="全部",capQ="";
$("#capbar").innerHTML=`<input id="capq" placeholder="搜能力 / 文件名 / 关键词">`+
  ["全部",...LAYERS].map(l=>`<span class="chip${l==="全部"?" on":""}" data-l="${l}">${l}</span>`).join("")+
  `<span class="count" id="capn"></span>`;
function renderCaps(){
  const q=capQ.toLowerCase();
  const rows=CAPS.filter(c=>(capL==="全部"||c.L===capL)&&
    (!q||(c.n+c.f+c.d+c.L).toLowerCase().includes(q)));
  $("#caps").innerHTML=rows.length?rows.map(c=>`<div class="card">
    <div class="top"><h4>${c.n}</h4><span class="file">${esc(c.f)}</span></div>
    <p>${c.d}</p><div><span class="tag">${c.L}</span>${c.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    </div>`).join(""):`<div class="empty">没有匹配的能力</div>`;
  $("#capn").textContent=`${rows.length} / ${CAPS.length} 项`;
}
$("#capbar").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c)return;
  capL=c.dataset.l;
  document.querySelectorAll("#capbar .chip").forEach(x=>x.classList.toggle("on",x===c));
  renderCaps();
});
$("#capq").addEventListener("input",e=>{capQ=e.target.value;renderCaps();});
renderCaps();

const KINDS=[...new Set(OPTS.map(o=>o.k))];
let optK="全部",optQ="";
$("#optbar").innerHTML=`<input id="optq" placeholder="搜优化项 / 现象 / 修法">`+
  ["全部",...KINDS].map(k=>`<span class="chip${k==="全部"?" on":""}" data-k="${k}">${k}</span>`).join("")+
  `<span class="count" id="optn"></span>`;
function renderOpts(){
  const q=optQ.toLowerCase();
  const rows=OPTS.filter(o=>(optK==="全部"||o.k===optK)&&
    (!q||(o.t+o.p+o.x+o.v+o.r+o.k).toLowerCase().includes(q)));
  $("#opts").innerHTML=rows.length?rows.map(o=>`<div class="item ${KMAP[o.k]||""}">
    <div class="hd"><b>${o.t}</b><span class="kind">${o.k}</span><span class="date">${o.r} · ${o.d}</span></div>
    <div class="body">
      <div class="row"><i>现象</i><div>${o.p}</div></div>
      <div class="row"><i>修法</i><div>${o.x}</div></div>
      <div class="row"><i>验证</i><div>${o.v}</div></div>
    </div></div>`).join(""):`<div class="empty">没有匹配的优化项</div>`;
  $("#optn").textContent=`${rows.length} / ${OPTS.length} 项`;
}
$("#optbar").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c)return;
  optK=c.dataset.k;
  document.querySelectorAll("#optbar .chip").forEach(x=>x.classList.toggle("on",x===c));
  renderOpts();
});
$("#optq").addEventListener("input",e=>{optQ=e.target.value;renderOpts();});
renderOpts();

$("#method").innerHTML=METHOD.map(m=>`<div class="card">
  <div class="top"><h4>${m.n}</h4><span class="file">${esc(m.f)}</span></div>
  <p>${m.d}</p><div>${m.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>`).join("");

document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id==="tab-"+b.dataset.tab));
}));

$("#foot").innerHTML=`能力 ${CAPS.length} 项 · 优化 ${OPTS.length} 项 · 方法 ${METHOD.length} 条。`+
  `数据手工整理自 <code>测试记录.md</code>（15 轮）、<code>README.md</code>、<code>系统设计链路详解.md</code> 与 <code>output/</code>、<code>videos/tesf_zyy/recut/</code> 产物；`+
  `新增条目直接改本文件顶部的 CAPS / OPTS / METHOD 数组。`;
</script>
